version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # The oxc crates depend on each other at the same version, so they can only move together.
      oxc:
        patterns:
          - oxc_*
    allow:
      # Patch releases fit the pins in Cargo.toml, so they don't need a PR. Keep `minor`: Dependabot's
      # filter treats every newer 0.x release as minor, so without it no 0.x crate would get a PR.
      - dependency-type: direct
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Its alpha bumps count as patches, so it needs every update type.
      - dependency-name: lightningcss

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Its refs pick the Rust toolchain, not a version of the action. The `1.95` one is the MSRV
      # and has to follow `rust-version` in Cargo.toml.
      - dependency-name: dtolnay/rust-toolchain
